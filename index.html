    <!-- NIGHT CITY on the 6 x 4 grid (RF-69 to RF-72): shared by the question and final screens (RF-29). One <g data-site> per leisure site. -->

      <!-- Progress header (RF-125 to RF-127), filled by js/app/hud.js. aria-hidden: the SVG's aria-label already says how many places are lit (RF-75, RNF-4). -->
      <header class="hud" aria-hidden="true"><span class="hud__brand">Leisure City</span>
        <span class="hud__meter"><span class="hud__pct">0%</span><small class="hud__count">0 of 10 places</small></span></header>
      <div class="city-box">
      <svg id="city" class="city" viewBox="0 0 400 292" role="img" aria-label="Night city: 0 of 10 places lit">
        <defs>
          <radialGradient id="glow">
            <stop offset="0" stop-color="#ffd36e" stop-opacity=".5"/>
            <stop offset="1" stop-color="#ffd36e" stop-opacity="0"/>
          </radialGradient>
          <!-- Light ring of the final wave (RF-73): clear inside, bright at 93 % of the radius, clear at the edge.
               r = 266, so the bright band (.93 x 266 = 247.4) reaches the corners (247.6 from the centre) as the wave
               ends, in step with the --fd of every building, lamp and street. -->
          <radialGradient id="wave-ring">
            <stop offset="0" stop-color="#fff2c4" stop-opacity="0"/>
            <stop offset=".8" stop-color="#fff2c4" stop-opacity="0"/>
            <stop offset=".93" stop-color="#fff2c4" stop-opacity=".55"/>
            <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="map-clip"><rect width="400" height="292" rx="12"/></clipPath>
        </defs>
        <!-- Bounded map on the 6 x 4 grid of the demo (RF-69, RF-111, plan §16.4): everything is drawn inside the
             rounded 400x292 clip. Drawing order: ground, streets, filler blocks and lamps (built by mountCityGrid in
             js/app/city.js from js/lib/city-grid.js), halos, the 10 sites, cars, labels (mountCityLabels), wave. -->
        <g class="city__map" clip-path="url(#map-clip)">
          <rect class="city__ground" width="400" height="292"/>
          <g class="city__streets" aria-hidden="true"></g>
          <g class="city__fillers" aria-hidden="true"></g>
          <g class="city__lamps" aria-hidden="true"></g>
          <!-- Warm halo of each lit site (RF-133): under the icons and the labels, so it never covers a label. -->
          <g class="city__halos" aria-hidden="true">
            <ellipse class="site__halo" data-halo="park" cx="104" cy="181" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="concert-hall" cx="296" cy="41" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="museum" cx="40" cy="41" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="theatre" cx="232" cy="251" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="cinema" cx="360" cy="111" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="fairground" cx="232" cy="181" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="town-square" cx="168" cy="41" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="food-market" cx="360" cy="251" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="nightclub" cx="232" cy="111" rx="50" ry="50" fill="url(#glow)"/>
            <ellipse class="site__halo" data-halo="stadium" cx="40" cy="111" rx="50" ry="50" fill="url(#glow)"/>
          </g>
          <!-- 10 leisure sites (RF-71, RF-133, RF-139, RF-141): each in its SITE_CELLS cell (js/lib/city-grid.js) with a
               pad, one icon seen from above in the 0-56 x 0-38 band at the top of the cell (the label goes below it)
               and the ring of a new site (RF-134). Lit: the .lt lights fade in. No text here: the name label is built
               by js/app/city.js (RF-112) and the screen-reader text is the SVG's aria-label (RF-75). -->

          <!-- 1. Park: lawn with a lit winding path, a pond and trees -->
          <g class="site" data-site="park" transform="translate(76 150)">
            <rect class="site__pad" width="56" height="62" rx="3"/>
            <g class="site__icon" transform="translate(0 2)">
              <rect class="body body--green" x="1" y="1" width="54" height="36" rx="6"/>
              <rect class="lt lt--green lt--soft" x="1" y="1" width="54" height="36" rx="6"/>
              <path class="lt-stroke lt-stroke--path" stroke-width="2.4" stroke-linecap="round" d="M1 14C14 12 16 26 26 32S46 35 55 31"/>

          <g class="city__cars" aria-hidden="true">

      <!-- "Lit up: <name>" toast over the map (RF-135 to RF-137), shown by js/app/hud.js. -->
      <p class="city__toast" aria-hidden="true"></p>
      </div>
      <!-- Question bar (RF-128 to RF-130): 10 <i> created by mountHud (js/app/hud.js). -->
      <div class="segs" aria-hidden="true"></div>
    </div>

    <!-- QUESTION (RF-17 to RF-36): what to show comes from js/lib/question-view.js; texts go in with textContent. -->
    <section id="screen-question" class="screen screen--question" aria-labelledby="question-title" hidden>
      <div class="question">
        <p class="question__count" id="question-count"></p>
        <h1 id="question-title" class="question__text" tabindex="-1" data-title aria-describedby="question-count"></h1>
        <div class="options" role="radiogroup" aria-labelledby="question-title"></div>
        <div class="answer-text" hidden>
          <label class="answer-text__label" for="answer-text"></label>
          <textarea id="answer-text" class="answer-text__input" rows="3" aria-describedby="answer-text-left" enterkeyhint="done"></textarea>
          <p class="answer-text__left" id="answer-text-left"></p>
        </div>
      </div>
      <div class="actions actions--nav">
        <button type="button" class="btn btn--secondary" data-action="back">Back</button>
        <button type="button" class="btn btn--primary" data-action="next" disabled>Next</button>
      </div>
      <!-- Offline notice (RF-49, RF-50): in the flow under Back/Next, so it never covers options, fields or buttons. -->
      <p class="offline-notice" data-offline-notice role="status" aria-live="polite"></p>
    </section>

    <!-- FINAL (RF-53 to RF-56): CSS timeline of 8 s at most (js/lib/final-view.js), then a fixed last state.
         The base styles ARE the last state; the animations only run while #app has data-final="play". -->
    <section id="screen-final" class="screen screen--final" aria-labelledby="final-title" hidden>
      <div class="final__stage">
        <ul class="final__flags" aria-label="Countries"></ul>
        <div class="final__flash" aria-hidden="true"></div>
      </div>
      <h1 id="final-title" class="screen__title final__title" tabindex="-1" data-title aria-label="Leisure for Society">Leisure for Society</h1>
      <p class="final__thanks"><span aria-hidden="true">Thank you</span><span class="visually-hidden">Thank you</span></p>
      <p class="offline-notice" data-offline-notice role="status" aria-live="polite"></p>
      <div class="confetti" aria-hidden="true"></div>
    </section>

  </main>
</body>
